[package]
name = "nmessenger-client"
version.workspace = true
edition = "2024"
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
nm-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query", "rustls"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
resvg = { version = "0.49", default-features = false }
quick-xml = "0.42.0"
base64 = "0.23.1"
zeroize = "1.9.1"
sys-locale = "0.3.2"
hound = "3.5.1"
sha2 = "0.11.1"
semver = "1.0.28"
argon2 = "0.6"
chacha20poly1305 = "0.11"
crypto_box = { version = "0.9.1", features = ["std"] }
ed25519-dalek = "3.0"
x25519-dalek = "3.0"
cpal = { version = "0.18.2", optional = true }

[features]
default = ["native-audio"]
native-audio = ["dep:cpal"]

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
zbus = "6.2.0"
keyring = "4.2.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = "4.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4.2.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }
jni = "0.22.4"

[dev-dependencies]
nm-servo = { path = "../nm-servo" }
actix-web = { version = "4.18.1", default-features = false, features = ["macros", "unicode", "ws"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
