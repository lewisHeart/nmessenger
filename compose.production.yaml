# docker compose -f compose.yaml -f compose.production.yaml up -d --build
# Requires Docker Compose >= 2.24.4 for !reset.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique production database password}
    ports: !reset []
    security_opt:
      - no-new-privileges:true

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a unique production Redis password}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
    security_opt:
      - no-new-privileges:true

  backend:
    environment:
      DATABASE_URL: postgres://nmessenger:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/nmessenger
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    ports: !reset []

  proxy:
    image: caddy:2-alpine
    environment:
      NM_DOMAIN: ${NM_DOMAIN:?Set the public DNS hostname for automatic HTTPS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16M,noexec,nosuid
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
