name: nmessenger

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nmessenger
      POSTGRES_USER: nmessenger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nmessenger_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmessenger -d nmessenger"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-63799}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://nmessenger:${POSTGRES_PASSWORD:-nmessenger_dev}@postgres:5432/nmessenger
      REDIS_URL: redis://redis:6379/0
      BIND_ADDR: 0.0.0.0:8080
      UPLOAD_DIR: /app/data/uploads
      USER_UPLOAD_QUOTA_BYTES: ${USER_UPLOAD_QUOTA_BYTES:-536870912}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      RUST_LOG: ${RUST_LOG:-nm_servo=info,actix_web=info}
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-18087}:8080"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/v1/health"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 20s
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32M,noexec,nosuid
    restart: unless-stopped

  test-postgres:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: nmessenger_test
      POSTGRES_USER: nmessenger
      POSTGRES_PASSWORD: nmessenger_test
    ports:
      - "127.0.0.1:${NM_TEST_POSTGRES_PORT:-55439}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmessenger -d nmessenger_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test-redis:
    image: redis:7.4-alpine
    profiles: ["test"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${NM_TEST_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  uploads:
